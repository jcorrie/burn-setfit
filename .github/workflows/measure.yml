# Measurements on the real all-MiniLM-L6-v2 checkpoint (#12), which most
# sandboxes cannot download but GitHub's runners can. Too slow for every PR,
# so it runs by hand (Actions tab -> Measure -> Run workflow) or when a pull
# request is given the `measure` label. Results go to the run's summary page.
name: Measure

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'measure'
    name: ${{ matrix.example }} on real MiniLM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        example: [quantize, long_document]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pretrained
      - uses: actions/cache@v4
        with:
          path: ~/.cache/burn-models
          key: minilm-checkpoints-v1
      - name: Run
        run: |
          set -o pipefail
          cargo run --locked --release --features ndarray,train,native --example ${{ matrix.example }} \
            2>&1 | tee output.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "## \`examples/${{ matrix.example }}.rs\` on all-MiniLM-L6-v2"
            echo
            echo '```'
            cat output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
