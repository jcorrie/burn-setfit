# Measurements on the real all-MiniLM-L6-v2 checkpoint (#12), which most
# sandboxes cannot download but GitHub's runners can. Too slow for every PR,
# so it runs by hand (Actions tab -> Measure -> Run workflow) or when a pull
# request is given the `measure` label. Results go to the run's summary page.
name: Measure

on:
  workflow_dispatch:
  pull_request:
    types: [labeled]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  measure:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'measure'
    name: ${{ matrix.example }} on real MiniLM
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        example: [quantize, long_document]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pretrained
      - uses: actions/cache@v4
        with:
          path: ~/.cache/burn-models
          key: minilm-checkpoints-v1
      - name: Run
        run: |
          set -o pipefail
          cargo run --locked --release --features ndarray,train,native --example ${{ matrix.example }} \
            2>&1 | tee output.txt
      - name: Summary
        if: always()
        run: |
          {
            echo "## \`examples/${{ matrix.example }}.rs\` on all-MiniLM-L6-v2"
            echo
            echo '```'
            cat output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # The browser harness, on the real checkpoint rather than the toy one (#12,
  # item 4): does training stay responsive and classify correctly at full size?
  browser-real:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'measure'
    name: browser harness on real MiniLM (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: browser
      - name: Build setfit-wasm
        run: cargo build --locked --release --target wasm32-unknown-unknown -p setfit-wasm
      - name: Read wasm-bindgen version
        id: bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { getline; gsub(/version = |"/, ""); print; exit }' Cargo.lock)
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@${{ steps.bindgen.outputs.version }}
      - name: Bindings and the real checkpoint
        run: |
          wasm-bindgen --target web --out-dir browser-test/public/pkg \
            target/wasm32-unknown-unknown/release/setfit_wasm.wasm
          mkdir -p browser-test/public/checkpoint
          for f in config.json model.safetensors tokenizer.json; do
            curl -sSfL -o "browser-test/public/checkpoint/$f" \
              "https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/$f"
          done
          ls -la browser-test/public/checkpoint
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: browser-test/package-lock.json
      - name: Install Playwright ${{ matrix.engine }}
        working-directory: browser-test
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.engine }}
      - name: Run harness
        working-directory: browser-test
        run: |
          set -o pipefail
          node run.mjs 2>&1 | tee output.txt
        env:
          BROWSER: ${{ matrix.engine }}
          TIMEOUT_MS: '1800000'
          # Measured: a contrastive step on the real model stalls the main
          # thread for ~3 s, so stalls are reported here rather than failed on.
          # Real use trains in a Web Worker.
          FRAME_GAP_BUDGET_MS: '10000'
      - name: Summary
        if: always()
        run: |
          {
            echo "## Browser harness on all-MiniLM-L6-v2 (${{ matrix.engine }})"
            echo
            echo '```'
            cat browser-test/output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
