[workspace]
members = [".", "crates/setfit-wasm"]

[package]
name = "burn-setfit"
version = "0.1.0"
edition = "2024"
# Measured, not inferred: 1.91 is refused outright because burn 0.21 and
# cubecl-zspace declare 1.92, and the whole suite passes on 1.92. Our own code
# needs less than that — edition 2024 wants 1.85, the let-chains in `config.rs`
# want 1.88 — so this floor moves with Burn rather than with us.
rust-version = "1.92"
license = "MIT OR Apache-2.0"
description = "SetFit few-shot text classification in Rust with Burn, targeting native and wasm"
repository = "https://github.com/jcorrie/burn-setfit"
readme = "README.md"
keywords = ["setfit", "few-shot", "classification", "burn", "wasm"]
categories = ["science", "text-processing", "wasm"]
# The browser harness is a test rig, not part of the published crate; the toy
# checkpoint it needs is generated, not committed.
exclude = ["/browser-test"]

# Document every feature, and mark the feature-gated items as such, so `train`
# and `native` items are not silently missing from the rendered docs.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["ndarray", "train", "native"]

# Backends
ndarray = ["burn/ndarray"]
wgpu    = ["burn/wgpu"]

# Opt in to `wgpu` on wasm32, which is refused without it. The combination
# compiles and the async API it needs exists, but it has never been executed on
# a GPU in a browser — see the feature table in `src/lib.rs` and issue #5. The
# name is the warning: do not enable it and then report the result as tested.
wgpu-wasm-unverified = ["wgpu"]

# Few-shot training (contrastive body fine-tune + head fit). Works on wasm.
train = ["burn/autodiff", "dep:rand"]

# Filesystem + HuggingFace Hub loading. NOT wasm-compatible.
native = ["dep:hf-hub", "dep:dirs", "burn/network"]

[dependencies]
burn        = { version = "0.21.0", default-features = false, features = ["std"] }
burn-store  = { version = "0.21.0", default-features = false, features = ["std", "safetensors"] }
safetensors = "0.7"

# `unstable_wasm` swaps oniguruma (C, wasm-hostile) for fancy-regex. Works natively too,
# so we use one regex backend everywhere rather than diverging per target.
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"] }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
rand       = { version = "0.9", optional = true }
hf-hub     = { version = "0.5", optional = true }
dirs       = { version = "6", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# Both majors are live in the tree; each needs its browser entropy backend enabled.
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
serde_json = "1"
burn-store = { version = "0.21.0", default-features = false, features = ["std", "safetensors"] }
burn = { version = "0.21.0", default-features = false, features = ["std", "ndarray", "autodiff"] }
