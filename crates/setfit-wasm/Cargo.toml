[package]
name = "setfit-wasm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Browser bindings for burn-setfit"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# No `native`: hf-hub and std::fs are what break a wasm build. Bytes arrive
# from JavaScript instead.
burn-setfit = { path = "../..", default-features = false, features = ["ndarray", "train"] }
burn = { version = "0.21.0", default-features = false, features = ["std", "ndarray", "autodiff"] }

wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = ["console_error_panic_hook"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
